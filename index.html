<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS.CUSTOM — Garage Control</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-main: #121212; --bg-card: #1a1a1a; --primary: #ff5500; --text-main: #ffffff; --text-muted: #a0a0a0; --border: #2d2d2d; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a; z-index: 9999; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .auth-card { background: var(--bg-card); width: 100%; max-width: 400px; padding: 30px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #242424; border: 1px solid var(--border); color: white; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: var(--primary); border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>BS.CUSTOM</h2>
            <form id="auth-form">
                <input type="email" id="auth-email" placeholder="E-mail" required>
                <input type="password" id="auth-password" placeholder="Senha" required>
                <button type="submit" id="auth-btn">Entrar no Sistema</button>
            </form>
        </div>
    </div>

    <main style="padding: 20px;">
        <h1>Garagem Técnica</h1>
        <p>Sistema autenticado com sucesso!</p>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
  apiKey: "AIzaSyBr_NKOSzmh2CwbR7SYaLAk_0TsYe39VTY",
  authDomain: "moto-sys.firebaseapp.com",
  projectId: "moto-sys",
  storageBucket: "moto-sys.firebasestorage.app",
  messagingSenderId: "267462641413",
  appId: "1:267462641413:web:f4d176ae31a2bdf970596c",
  measurementId: "G-4CZD6SMLWZ"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const authForm = document.getElementById('auth-form');
        const authOverlay = document.getElementById('auth-overlay');

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                alert("Erro ao logar: " + err.message);
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authOverlay.classList.add('hidden');
            } else {
                authOverlay.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
