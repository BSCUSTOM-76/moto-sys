<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS.CUSTOM — Oficina & Garagem</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-main: #121212; --bg-card: #1a1a1a; --primary: #ff5500; --success: #00e676; --text: #fff; }
        body { background-color: var(--bg-main); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; }
        .maint-card { background: var(--bg-card); padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        .status-ok { color: var(--success); }
        .status-alert { color: #ffaa00; }
        .status-critical { color: var(--primary); }
        .progress-container { background: #333; height: 8px; border-radius: 4px; margin: 10px 0; }
        .progress-bar { height: 100%; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>Garagem BS.CUSTOM</h1>
    <div id="maint-cards-container">Carregando dados...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBr_NKOSzmh2CwbR7SYaLAk_0TsYe39VTY",
            authDomain: "moto-sys.firebaseapp.com",
            projectId: "moto-sys",
            storageBucket: "moto-sys.firebasestorage.app",
            messagingSenderId: "267462641413",
            appId: "1:267462641413:web:f4d176ae31a2bdf970596c",
            measurementId: "G-4CZD6SMLWZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const LIMITES = { "Oleo Motor": 3000, "Filtro Oleo": 6000, "Relação": 15000, "Vela": 10000, "Pneu Traseiro": 12000, "Pneu Dianteiro": 18000 };

        // Função para disparar notificação
        function dispararAlerta(tipo, km) {
            if (Notification.permission === "granted") {
                new Notification("BS.CUSTOM - Atenção!", { body: `${tipo} precisa de manutenção! Faltam ${km} km.` });
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }

        // Carrega dados e renderiza
        onSnapshot(collection(db, "motos"), (snapshot) => {
            const container = document.getElementById('maint-cards-container');
            container.innerHTML = "";
            snapshot.forEach((doc) => {
                const moto = doc.data();
                Object.keys(LIMITES).forEach(tipo => {
                    const limite = LIMITES[tipo];
                    const kmRodados = moto.km || 0; // Ajuste conforme seu campo de km no banco
                    const kmRestantes = limite - kmRodados;

                    let status = "OK", cor = "var(--success)", aviso = "";
                    if (kmRodados >= limite) {
                        status = "VENCIDO"; cor = "var(--primary)";
                        aviso = "⚠️ TROCA NECESSÁRIA!";
                    } else if (kmRestantes <= 500) {
                        status = "ALERTA"; cor = "#ffaa00";
                        aviso = `⚠️ Faltam ${kmRestantes} km`;
                        dispararAlerta(tipo, kmRestantes);
                    }

                    container.innerHTML += `
                        <div class="maint-card">
                            <strong>${tipo}</strong> - <span class="status-${status.toLowerCase()}">${status}</span>
                            <div class="progress-container"><div class="progress-bar" style="width: 50%; background: ${cor}"></div></div>
                            <small>${aviso}</small>
                        </div>`;
                });
            });
        });
    </script>
</body>
</html>
