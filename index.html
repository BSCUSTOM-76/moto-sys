<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS.CUSTOM — Oficina & Garagem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #121212; --primary: #ff5500; --card: #1a1a1a; --text: #ffffff; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 4px solid var(--primary); }
        h1 { color: var(--primary); font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body>

    <main>
        <h1>Garagem BS.CUSTOM</h1>
        <div id="maint-cards-container">Carregando sua garagem...</div>
    </main>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const config = {
            apiKey: "AIzaSyBr_NKOSzmh2CwbR7SYaLAk_0TsYe39VTY",
            authDomain: "moto-sys.firebaseapp.com",
            projectId: "moto-sys",
            storageBucket: "moto-sys.firebasestorage.app",
            messagingSenderId: "267462641413",
            appId: "1:267462641413:web:f4d176ae31a2bdf970596c"
        };

        const app = !getApps().length ? initializeApp(config) : getApps()[0];
        const db = getFirestore(app);

        const container = document.getElementById('maint-cards-container');

        // Carrega as motos do Firestore
        onSnapshot(collection(db, "motos"), (snapshot) => {
            container.innerHTML = "";
            snapshot.forEach((doc) => {
                const moto = doc.data();
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <h3>${moto.modelo || 'Sem Modelo'}</h3>
                    <p>KM Atual: ${moto.km || 0}</p>
                `;
                container.appendChild(div);
            });
        });
    </script>
</body>
</html>
