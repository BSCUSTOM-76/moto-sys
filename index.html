<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS Custom - Gestão Técnica</title>
    <style>
        :root {
            --bg-dark: #121214;
            --card-bg: #202024;
            --card-border: #29292e;
            --primary: #e53935;
            --primary-hover: #d32f2f;
            --text-main: #e1e1e6;
            --text-muted: #a8a8b3;
            --success: #00b37e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* OVERLAY DE AUTENTICAÇÃO */
        #auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(18, 18, 20, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 2.5rem;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--card-border);
        }

        .auth-tab {
            flex: 1;
            padding: 0.75rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
        }

        .auth-tab.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        /* LAYOUT PRINCIPAL */
        .sidebar {
            width: 260px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--card-border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-item {
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .nav-item.active, .nav-item:hover {
            background-color: #29292e;
            color: var(--text-main);
        }

        .content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        /* CARDS & FORMS */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .maint-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 1.25rem;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .maint-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .maint-name {
            font-weight: 600;
        }

        .maint-status {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: bold;
        }

        .status-ok { background: rgba(0, 179, 126, 0.2); color: var(--success); }
        .status-alert { background: rgba(255, 170, 0, 0.2); color: #ffaa00; }
        .status-critical { background: rgba(229, 57, 53, 0.2); color: var(--primary); }

        .progress-container {
            width: 100%;
            height: 8px;
            background-color: var(--card-border);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.75rem;
        }

        .progress-bar {
            height: 100%;
            transition: width 0.3s ease;
        }

        form {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 1.5rem;
            border-radius: 8px;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        input, select {
            background: #121214;
            border: 1px solid var(--card-border);
            padding: 0.75rem;
            border-radius: 6px;
            color: var(--text-main);
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        button.btn-primary {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 0.75rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--card-border);
        }

        th {
            background-color: #29292e;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- OVERLAY DE LOGIN / CADASTRO -->
    <div id="auth-overlay">
        <div class="auth-card">
            <div class="brand" style="justify-content: center;">⚡ BS CUSTOM</div>
            <div class="auth-tabs">
                <button id="tab-login" class="auth-tab active" onclick="switchAuthMode(true)">Entrar</button>
                <button id="tab-register" class="auth-tab" onclick="switchAuthMode(false)">Cadastrar</button>
            </div>
            <p id="auth-msg" style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; text-align: center;">Acesse sua garagem técnica</p>
            <form id="form-auth" onsubmit="handleAuth(event)" style="padding:0; border:none; background:none;">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="auth-email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="auth-password" required placeholder="******">
                </div>
                <button type="submit" id="auth-btn" class="btn-primary" style="margin-top: 0.5rem;">Entrar no Sistema</button>
            </form>
        </div>
    </div>

    <!-- SIDEBAR / MENU -->
    <div class="sidebar">
        <div class="brand">⚡ BS CUSTOM</div>
        <nav>
            <div class="nav-item active" onclick="switchView('status', this)">📊 Status das Peças</div>
            <div class="nav-item" onclick="switchView('lancar', this)">🛠️ Lançar Serviço</div>
            <div class="nav-item" onclick="switchView('motos', this)">🏍️ Nova Moto</div>
            <div class="nav-item" onclick="switchView('historico', this)">📋 Histórico</div>
        </nav>
        <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--card-border);">
            <div id="display-user-email" style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem; word-break: break-all;"></div>
            <button onclick="logout()" style="background:none; border:none; color: var(--primary); cursor:pointer; font-size: 0.85rem;">Sair da Conta</button>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="content">
        <div style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem;">
            <label for="global-moto-selector" style="font-weight: bold;">Moto Selecionada:</label>
            <select id="global-moto-selector" onchange="setActiveMoto(this.value)" style="min-width: 250px;">
                <option value="">Carregando frotas...</option>
            </select>
        </div>

        <div id="view-status" class="view-section active">
            <h2>Status de Manutenção Preventiva</h2>
            <div id="maint-cards-container" class="grid-cards"></div>
        </div>

        <div id="view-lancar" class="view-section">
            <h2>Lançar Nova Manutenção</h2>
            <form id="form-manutencao" onsubmit="cadastrarManutencao(event)">
                <div class="form-group">
                    <label>Componente / Peça</label>
                    <select id="manut-tipo" required>
                        <option value="Oleo Motor">Óleo do Motor</option>
                        <option value="Filtro Oleo">Filtro de Óleo</option>
                        <option value="Relação">Kit Relação</option>
                        <option value="Vela">Vela de Ignição</option>
                        <option value="Pneu Traseiro">Pneu Traseiro</option>
                        <option value="Pneu Dianteiro">Pneu Dianteiro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Quilometragem da Troca/Serviço (KM)</label>
                    <input type="number" id="manut-km" required placeholder="Ex: 15400">
                </div>
                <div class="form-group">
                    <label>Data do Serviço</label>
                    <input type="date" id="manut-data" required>
                </div>
                <button type="submit" class="btn-primary">Registrar Serviço</button>
            </form>
        </div>

        <div id="view-motos" class="view-section">
            <h2>Cadastrar Novo Veículo</h2>
            <form id="form-moto" onsubmit="cadastrarMoto(event)">
                <div class="form-group">
                    <label>Modelo do Veículo</label>
                    <input type="text" id="moto-modelo" required placeholder="Ex: Honda CG 160 Fan">
                </div>
                <div class="form-group">
                    <label>Ano de Fabricação</label>
                    <input type="number" id="moto-ano" required placeholder="Ex: 2022">
                </div>
                <div class="form-group">
                    <label>Odômetro Atual (KM)</label>
                    <input type="number" id="moto-km" required placeholder="Ex: 12000">
                </div>
                <div class="form-group">
                    <label>Estimativa de Uso Diário (KM/Dia)</label>
                    <input type="number" id="moto-media" required value="30" placeholder="Ex: 30">
                </div>
                <button type="submit" class="btn-primary">Salvar na Garagem</button>
            </form>
        </div>

        <div id="view-historico" class="view-section">
            <h2>Histórico Completo de Manutenções</h2>
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Item</th>
                        <th>Quilometragem</th>
                        <th>Status</th>
                        <th style="text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="history-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- FIREBASE & LOGICA BLINDADA CONTRA ERROS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBr_NKOSzmh2CwbR7SYaLAk_0TsYe39VTY",
            authDomain: "moto-sys.firebaseapp.com",
            projectId: "moto-sys",
            storageBucket: "moto-sys.firebasestorage.app",
            messagingSenderId: "267462641413",
            appId: "1:267462641413:web:f4d176ae31a2bdf970596c",
            measurementId: "G-4CZD6SMLWZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let isLoginMode = true;
        let activeMotoId = null;
        let motosData = [];

        const LIMITES = {
            "Oleo Motor": 3000,
            "Filtro Oleo": 6000,
            "Relação": 15000,
            "Vela": 10000,
            "Pneu Traseiro": 12000,
            "Pneu Dianteiro": 18000
        };

        window.switchAuthMode = function(mode) {
            isLoginMode = mode;
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const authBtn = document.getElementById('auth-btn');
            const authMsg = document.getElementById('auth-msg');

            if (tabLogin) tabLogin.className = mode ? 'auth-tab active' : 'auth-tab';
            if (tabRegister) tabRegister.className = mode ? 'auth-tab' : 'auth-tab active';
            if (authBtn) authBtn.innerText = mode ? 'Entrar no Sistema' : 'Criar Conta Técnica';
            if (authMsg) authMsg.innerText = mode ? 'Acesse sua garagem técnica de projetos' : 'Crie sua conta para gerenciar sua frota';
        };

        window.handleAuth = async function(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            
            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                console.error("Erro na autenticação:", error);
                alert("Erro: " + error.message);
            }
        };

        window.logout = function() {
            signOut(auth);
        };

        // ESCUTADOR TRATADO CONTRA ERRO NULL
        onAuthStateChanged(auth, (user) => {
            const overlay = document.getElementById('auth-overlay');
            const userEmailDisplay = document.getElementById('display-user-email');

            if (user) {
                currentUser = user;
                if (overlay) overlay.style.display = 'none';
                if (userEmailDisplay) userEmailDisplay.innerText = user.email;
                initApp();
            } else {
                currentUser = null;
                if (overlay) overlay.style.display = 'flex';
                if (userEmailDisplay) userEmailDisplay.innerText = '';
                limparDadosInterface();
            }
        });

        function limparDadosInterface() {
            const selector = document.getElementById('global-moto-selector');
            const container = document.getElementById('maint-cards-container');
            const historyTable = document.getElementById('history-table-body');

            if (selector) selector.innerHTML = '<option value="">Nenhuma moto cadastrada</option>';
            if (container) container.innerHTML = '';
            if (historyTable) historyTable.innerHTML = '';

            activeMotoId = null;
            motosData = [];
        }

        function initApp() {
            const qMotos = query(
                collection(db, "motos"), 
                where("id_usuario", "==", currentUser.uid)
            );

            onSnapshot(qMotos, (snapshot) => {
                const selector = document.getElementById('global-moto-selector');
                if (!selector) return;

                selector.innerHTML = '';
                motosData = [];

                if (snapshot.empty) {
                    selector.innerHTML = '<option value="">Nenhuma moto cadastrada</option>';
                    limparPaineis();
                    return;
                }

                snapshot.forEach((doc) => {
                    const moto = { id: doc.id, ...doc.data() };
                    motosData.push(moto);
                    
                    const opt = document.createElement('option');
                    opt.value = moto.id;
                    opt.innerText = `${moto.modelo} (${moto.ano}) — ${moto.odometro_atual || 0} KM`;
                    selector.appendChild(opt);
                });

                if (!activeMotoId || !motosData.find(m => m.id === activeMotoId)) {
                    activeMotoId = motosData[0].id;
                }
                selector.value = activeMotoId;
                carregarDadosMotoAtiva();
            });
        }

        function limparPaineis() {
            const container = document.getElementById('maint-cards-container');
            const historyTable = document.getElementById('history-table-body');
            if (container) container.innerHTML = '<p style="color: var(--text-muted)">Cadastre uma moto para visualizar o status.</p>';
            if (historyTable) historyTable.innerHTML = '<tr><td colspan="5" style="color: var(--text-muted); text-align: center;">Nenhum registro encontrado.</td></tr>';
        }

        window.setActiveMoto = function(id) {
            if(!id) return;
            activeMotoId = id;
            carregarDadosMotoAtiva();
        };

        function carregarDadosMotoAtiva() {
            if (!activeMotoId || !currentUser) return;

            const motoAtiva = motosData.find(m => m.id === activeMotoId);
            if (!motoAtiva) return;

            const qManut = query(
                collection(db, "manutencoes"),
                where("id_usuario", "==", currentUser.uid),
                where("id_moto", "==", activeMotoId),
                orderBy("km_realizada", "desc")
            );

            onSnapshot(qManut, (snapshot) => {
                const manutencoes = [];
                snapshot.forEach((doc) => {
                    manutencoes.push({ id: doc.id, ...doc.data() });
                });

                renderizarStatusPecas(motoAtiva, manutencoes);
                renderizarHistorico(manutencoes);
            });
        }

        window.cadastrarMoto = async function(e) {
            e.preventDefault();
            if (!currentUser) return;

            const novaMoto = {
                modelo: document.getElementById('moto-modelo').value,
                ano: parseInt(document.getElementById('moto-ano').value),
                odometro_atual: parseInt(document.getElementById('moto-km').value),
                km_diaria_estimada: parseInt(document.getElementById('moto-media').value),
                id_usuario: currentUser.uid
            };

            try {
                await addDoc(collection(db, "motos"), novaMoto);
                alert("Moto adicionada com sucesso!");
                document.getElementById('form-moto').reset();
            } catch (err) {
                console.error(err);
                alert("Erro ao salvar veículo: " + err.message);
            }
        };

        window.cadastrarManutencao = async function(e) {
            e.preventDefault();
            if (!activeMotoId || !currentUser) {
                alert("Por favor, selecione ou cadastre uma moto antes.");
                return;
            }

            const kmLancada = parseInt(document.getElementById('manut-km').value);

            const novaManut = {
                id_moto: activeMotoId,
                id_usuario: currentUser.uid,
                tipo_componente: document.getElementById('manut-tipo').value,
                km_realizada: kmLancada,
                data_servico: document.getElementById('manut-data').value
            };

            try {
                await addDoc(collection(db, "manutencoes"), novaManut);

                const motoAtiva = motosData.find(m => m.id === activeMotoId);
                if (motoAtiva && kmLancada > (motoAtiva.odometro_atual || 0)) {
                    const motoRef = doc(db, "motos", activeMotoId);
                    await updateDoc(motoRef, { odometro_atual: kmLancada });
                }

                alert("Serviço registrado com sucesso!");
                document.getElementById('form-manutencao').reset();
            } catch (err) {
                console.error(err);
                alert("Erro ao lançar manutenção: " + err.message);
            }
        };

        window.excluirManutencao = async function(id) {
            if (confirm("Tem certeza que deseja excluir este registro de manutenção?")) {
                try {
                    await deleteDoc(doc(db, "manutencoes", id));
                    alert("Registro excluído com sucesso!");
                } catch (err) {
                    console.error(err);
                    alert("Erro ao excluir registro: " + err.message);
                }
            }
        };

        window.editarManutencao = async function(id, kmAtual, dataAtual) {
            const novaKm = prompt("Informe a nova KM da manutenção:", kmAtual);
            if (novaKm === null || novaKm.trim() === "") return;

            const novaData = prompt("Informe a nova data (AAAA-MM-DD):", dataAtual);
            if (novaData === null || novaData.trim() === "") return;

            try {
                const manutRef = doc(db, "manutencoes", id);
                await updateDoc(manutRef, {
                    km_realizada: parseInt(novaKm),
                    data_servico: novaData
                });
                alert("Manutenção atualizada com sucesso!");
            } catch (err) {
                console.error(err);
                alert("Erro ao editar manutenção: " + err.message);
            }
        };

        function renderizarStatusPecas(moto, manutencoes) {
            const container = document.getElementById('maint-cards-container');
            if (!container) return;
            container.innerHTML = '';

            const odometroAtual = Number(moto.odometro_atual) || 0;
            const mediaDiaria = Number(moto.km_diaria_estimada) || 1;

            Object.keys(LIMITES).forEach(tipo => {
                const limite = LIMITES[tipo];
                const ultimas = manutencoes.filter(m => m.tipo_componente === tipo);
                const ultimaManut = ultimas.length > 0 ? ultimas[0] : null;
                const ultimaKm = ultimaManut ? Number(ultimaManut.km_realizada) : 0;
                
                const kmRodados = Math.max(0, odometroAtual - ultimaKm);
                const kmRestantes = limite - kmRodados;
                let pctUso = Math.min(100, Math.max(0, (kmRodados / limite) * 100));

                let statusTexto = "OK";
                let statusClass = "status-ok";
                let corBarra = "var(--success)";
                let mensagemPrazo = "";

                if (kmRestantes > 0) {
                    const diasRestantes = Math.round(kmRestantes / mediaDiaria);
                    if (diasRestantes > 30) {
                        const meses = (diasRestantes / 30).toFixed(1);
                        mensagemPrazo = `Faltam <strong>${kmRestantes} KM</strong> (~${meses} meses)`;
                    } else {
                        mensagemPrazo = `Faltam <strong>${kmRestantes} KM</strong> (~${diasRestantes} dias)`;
                    }
                } else {
                    const kmVencidos = Math.abs(kmRestantes);
                    mensagemPrazo = `<span style="color:var(--primary); font-weight:bold;">Vencido há ${kmVencidos} KM!</span>`;
                }

                if (pctUso >= 100) {
                    statusTexto = "CRÍTICO";
                    statusClass = "status-critical";
                    corBarra = "var(--primary)";
                } else if (pctUso >= 80) {
                    statusTexto = "ALERTA";
                    statusClass = "status-alert";
                    corBarra = "#ffaa00";
                }

                let acoesHtml = '';
                if (ultimaManut) {
                    acoesHtml = `
                        <div style="margin-top: 8px; display: flex; gap: 8px; justify-content: flex-end;">
                            <button onclick="editarManutencao('${ultimaManut.id}', ${ultimaManut.km_realizada}, '${ultimaManut.data_servico}')" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.85rem;" title="Editar Última Manutenção">✏️ Editar</button>
                            <button onclick="excluirManutencao('${ultimaManut.id}')" style="background: none; border: none; color: var(--primary); cursor: pointer; font-size: 0.85rem;" title="Excluir Registro">🗑️ Excluir</button>
                        </div>
                    `;
                }

                const card = document.createElement('div');
                card.className = 'maint-card';
                card.innerHTML = `
                    <div>
                        <div class="maint-info">
                            <span class="maint-name">${traduzirTipo(tipo)}</span>
                            <span class="maint-status ${statusClass}">${statusTexto}</span>
                        </div>
                        <div class="progress-container">
                            <div class="progress-bar" style="width: ${pctUso}%; background-color: ${corBarra}"></div>
                        </div>
                    </div>
                    <div class="maint-desc">
                        ${mensagemPrazo}<br>
                        <span style="font-size:0.78rem; color: var(--text-muted)">
                            Uso: ${kmRodados} KM de ${limite} KM
                            ${ultimaKm > 0 ? `<br>(Última troca em ${ultimaKm} KM)` : '<br>(Nenhuma troca registrada)'}
                        </span>
                        ${acoesHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderizarHistorico(manutencoes) {
            const tbody = document.getElementById('history-table-body');
            if (!tbody) return;
            tbody.innerHTML = '';

            if (manutencoes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="color: var(--text-muted); text-align: center;">Nenhum serviço registrado nesta moto.</td></tr>';
                return;
            }

            manutencoes.forEach(m => {
                const dataFormatada = new Date(m.data_servico + 'T00:00:00').toLocaleDateString('pt-BR');
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${dataFormatada}</strong></td>
                    <td><span style="color: var(--primary); font-weight:600;">${traduzirTipo(m.tipo_componente)}</span></td>
                    <td>${m.km_realizada} KM</td>
                    <td><small style="color: var(--text-muted)">Registrado</small></td>
                    <td style="text-align: center;">
                        <button onclick="editarManutencao('${m.id}', ${m.km_realizada}, '${m.data_servico}')" style="background:none; border:none; cursor:pointer; margin-right: 5px;" title="Editar">✏️</button>
                        <button onclick="excluirManutencao('${m.id}')" style="background:none; border:none; cursor:pointer;" title="Excluir">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function traduzirTipo(tipo) {
            const mapas = {
                "Oleo Motor": "Óleo do Motor",
                "Filtro Oleo": "Filtro de Óleo",
                "Relação": "Kit Relação",
                "Vela": "Vela de Ignição",
                "Pneu Traseiro": "Pneu Traseiro",
                "Pneu Dianteiro": "Pneu Dianteiro"
            };
            return mapas[tipo] || tipo;
        }

        window.switchView = function(viewName, element) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            
            const target = document.getElementById(`view-${viewName}`);
            if (target) target.classList.add('active');
            if (element) element.classList.add('active');
        };
    </script>
</body>
</html>
