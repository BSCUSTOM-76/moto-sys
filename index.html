<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS.CUSTOM — Garage Control</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-main: #121212; --bg-card: #1a1a1a; --primary: #ff5500; --text-main: #ffffff; --text-muted: #a0a0a0; --border: #2d2d2d; --success: #00e676; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; min-height: 100vh; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .auth-card { background: var(--bg-card); width: 100%; max-width: 400px; padding: 30px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #242424; border: 1px solid var(--border); color: white; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: var(--primary); border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
        main { flex-grow: 1; padding: 40px; }
        .maint-card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .progress-container { background: #242424; height: 8px; border-radius: 4px; overflow: hidden; margin: 10px 0; }
        .progress-bar { height: 100%; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>BS.CUSTOM</h2>
            <form id="auth-form">
                <input type="email" id="auth-email" placeholder="E-mail" required>
                <input type="password" id="auth-password" placeholder="Senha" required>
                <button type="submit">Entrar no Sistema</button>
            </form>
        </div>
    </div>

    <main>
        <h2>Garagem Técnica</h2>
        <div id="app-content">
            <select id="moto-selector"><option>Carregando...</option></select>
            <div id="maint-cards-container"></div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBr_NKOSzmh2CwbR7SYaLAk_0TsYe39VTY",
            authDomain: "moto-sys.firebaseapp.com",
            projectId: "moto-sys",
            storageBucket: "moto-sys.firebasestorage.app",
            messagingSenderId: "267462641413",
            appId: "1:267462641413:web:f4d176ae31a2bdf970596c",
            measurementId: "G-4CZD6SMLWZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Login
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            try { await signInWithEmailAndPassword(auth, email, pass); } 
            catch (err) { alert("Erro: " + err.message); }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-overlay').classList.add('hidden');
                carregarDados(user.uid);
            } else {
                document.getElementById('auth-overlay').classList.remove('hidden');
            }
        });

        function carregarDados(uid) {
            const q = query(collection(db, "motos"), where("id_usuario", "==", uid));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('maint-cards-container');
                container.innerHTML = '<h3>Pneu Dianteiro e Traseiro monitorados</h3>';
                // Adicione aqui a lógica de renderização dos cards (o LIMITES, etc)
            });
        }
    </script>
</body>
</html>
