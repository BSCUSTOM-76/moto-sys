<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>BS.CUSTOM — Garage Control</title>
    <style>
        :root { --bg: #121212; --card: #1a1a1a; --primary: #ff5500; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; }
        .hidden { display: none !important; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="auth-overlay">
        <form id="auth-form">
            <input type="email" id="auth-email" placeholder="E-mail" required><br>
            <input type="password" id="auth-password" placeholder="Senha" required><br>
            <button type="submit">Entrar</button>
        </form>
    </div>

    <main id="app-content" class="hidden">
        <h1>Garagem Técnica</h1>
        <select id="moto-selector"></select>
        <div id="maint-cards"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBr_NKOSzmh2CwbR7SYaLAk_0TsYe39VTY",
            authDomain: "moto-sys.firebaseapp.com",
            projectId: "moto-sys",
            storageBucket: "moto-sys.firebasestorage.app",
            messagingSenderId: "267462641413",
            appId: "1:267462641413:web:f4d176ae31a2bdf970596c",
            measurementId: "G-4CZD6SMLWZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            try { await signInWithEmailAndPassword(auth, document.getElementById('auth-email').value, document.getElementById('auth-password').value); }
            catch (err) { alert("Erro: " + err.message); }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-overlay').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                carregarMotos(user.uid);
            }
        });

        function carregarMotos(uid) {
            onSnapshot(query(collection(db, "motos"), where("id_usuario", "==", uid)), (snap) => {
                const sel = document.getElementById('moto-selector');
                sel.innerHTML = '';
                snap.forEach(doc => {
                    const moto = doc.data();
                    sel.innerHTML += `<option value="${doc.id}">${moto.modelo}</option>`;
                    // Aqui você chama a lógica de calcular o desgaste da moto
                    document.getElementById('maint-cards').innerHTML = `<div class="card">Moto: ${moto.modelo} - KM: ${moto.odometro_atual}</div>`;
                });
            });
        }
    </script>
</body>
</html>
