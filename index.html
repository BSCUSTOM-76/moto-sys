<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

<body>
    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Configuração
        const config = {
            apiKey: "AIzaSyBr_NKOSzmh2CwbR7SYaLAk_0TsYe39VTY",
            authDomain: "moto-sys.firebaseapp.com",
            projectId: "moto-sys",
            storageBucket: "moto-sys.firebasestorage.app",
            messagingSenderId: "267462641413",
            appId: "1:267462641413:web:f4d176ae31a2bdf970596c"
        };

        // Inicialização Segura
        const app = !getApps().length ? initializeApp(config) : getApps()[0];
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Exportar para o escopo global para o seu HTML conseguir ler
        window.db = db;
        window.auth = auth;

        console.log("Sistema BS.CUSTOM carregado com sucesso!");
        
        // COLE O RESTANTE DO SEU JAVASCRIPT AQUI ABAIXO
        // Certifique-se de que não haja um 'initializeApp' repetido aqui dentro
    </script>
</body>
