<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS.CUSTOM — Oficina & Garagem</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-main: #121212; --bg-card: #1a1a1a; --bg-input: #242424; --primary: #ff5500; --text-main: #ffffff; --text-muted: #a0a0a0; --border: #2d2d2d; --success: #00e676; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; min-height: 100vh; }
        sidebar { width: 260px; background: var(--bg-card); border-right: 1px solid var(--border); padding: 30px 20px; }
        main { flex-grow: 1; padding: 40px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .maint-card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .progress-container { background: var(--bg-input); height: 8px; border-radius: 4px; overflow: hidden; margin: 10px 0; }
        .progress-bar { height: 100%; transition: width 0.5s; }
        .status-ok { color: var(--success); }
        .status-alert { color: #ffaa00; }
        .status-critical { color: var(--primary); }
    </style>
</head>
<body>
    <sidebar>
        <h1 style="color:var(--primary)">BS.CUSTOM</h1>
        <div style="margin-top:40px;">
            <div class="nav-item" onclick="switchView('garagem')">Garagem</div>
            <div class="nav-item" onclick="switchView('status')">Status de Peças</div>
        </div>
    </sidebar>

    <main>
        <section id="view-garagem" class="view-section"><h2>Garagem</h2></section>
        <section id="view-status" class="view-section active">
            <h2>Status de Peças</h2>
            <div id="maint-cards-container"></div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBr_NKOSzmh2CwbR7SYaLAk_0TsYe39VTY",
            authDomain: "moto-sys.firebaseapp.com",
            projectId: "moto-sys",
            storageBucket: "moto-sys.firebasestorage.app",
            messagingSenderId: "267462641413",
            appId: "1:267462641413:web:f4d176ae31a2bdf970596c"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const LIMITES = { "Oleo Motor": 3000, "Filtro Oleo": 6000, "Relação": 15000, "Vela": 10000, "Pneu Traseiro": 12000, "Pneu Dianteiro": 18000 };

        function solicitarPermissaoNotificacao() {
            if (Notification.permission === "default") Notification.requestPermission();
        }

        function dispararNotificacao(tipo, km) {
            if (Notification.permission === "granted") {
                new Notification("BS.CUSTOM - Atenção!", { body: `${tipo} está quase vencendo! Faltam ${km} km.` });
            }
        }

        onSnapshot(collection(db, "manutencoes"), (snapshot) => {
            const container = document.getElementById('maint-cards-container');
            container.innerHTML = '';
            solicitarPermissaoNotificacao();

            Object.keys(LIMITES).forEach(tipo => {
                const limite = LIMITES[tipo];
                // Lógica de cálculo simplificada para integrar com seu banco
                const kmRodados = 2000; // Aqui você puxaria o dado real da moto
                const kmRestantes = limite - kmRodados;
                
                let status = "OK", cor = "var(--success)", aviso = "";
                if (kmRestantes <= 500) {
                    status = "ALERTA"; cor = "#ffaa00";
                    aviso = `⚠️ Faltam ${kmRestantes} km`;
                    dispararNotificacao(tipo, kmRestantes);
                }

                container.innerHTML += `
                    <div class="maint-card">
                        <strong>${tipo}</strong> - <span class="status-${status.toLowerCase()}">${status}</span>
                        <div class="progress-container"><div class="progress-bar" style="width: 50%; background: ${cor}"></div></div>
                        <small>${aviso}</small>
                    </div>`;
            });
        });

        window.switchView = (v) => {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById('view-'+v).classList.add('active');
        };
    </script>
</body>
</html>
