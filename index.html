<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS.CUSTOM — Oficina & Garagem</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-main: #121212; --bg-card: #1a1a1a; --bg-input: #242424; --primary: #ff5500; --text-main: #ffffff; --text-muted: #a0a0a0; --border: #2d2d2d; --success: #00e676; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; display: flex; min-height: 100vh; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .hidden { display: none !important; }
        main { flex-grow: 1; padding: 40px; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <form id="auth-form" style="background:#1a1a1a; padding:30px; border-radius:12px; width:300px; text-align:center;">
            <h2 style="color:var(--primary)">BS.CUSTOM</h2>
            <input type="email" id="auth-email" placeholder="E-mail" required style="width:100%; padding:10px; margin-bottom:10px;"><br>
            <input type="password" id="auth-password" placeholder="Senha" required style="width:100%; padding:10px; margin-bottom:10px;"><br>
            <button type="submit" style="width:100%; padding:10px; background:var(--primary); color:white; border:none; cursor:pointer;">Entrar</button>
        </form>
    </div>

    <main id="app-content" class="hidden">
        <h1>Garagem Técnica</h1>
        <div id="maint-cards-container"></div>
    </main>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const config = {
            apiKey: "AIzaSyBr_NKOSzmh2CwbR7SYaLAk_0TsYe39VTY",
            authDomain: "moto-sys.firebaseapp.com",
            projectId: "moto-sys",
            storageBucket: "moto-sys.firebasestorage.app",
            messagingSenderId: "267462641413",
            appId: "1:267462641413:web:f4d176ae31a2bdf970596c"
        };

        const app = !getApps().length ? initializeApp(config) : getApps()[0];
        const auth = getAuth(app);

        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) { alert("Erro de acesso: " + err.message); }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-overlay').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
