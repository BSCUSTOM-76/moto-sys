<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS.CUSTOM — Oficina & Garagem</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; padding: 20px; }
        .card { background: #1a1a1a; padding: 15px; margin: 10px 0; border: 1px solid #333; border-radius: 8px; }
    </style>
</head>
<body>

    <main id="app-content">
        <h1>Garagem Técnica</h1>
        <div id="maint-cards-container">Carregando dados...</div>
    </main>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const config = {
            apiKey: "AIzaSyBr_NKOSzmh2CwbR7SYaLAk_0TsYe39VTY",
            authDomain: "moto-sys.firebaseapp.com",
            projectId: "moto-sys",
            storageBucket: "moto-sys.firebasestorage.app",
            messagingSenderId: "267462641413",
            appId: "1:267462641413:web:f4d176ae31a2bdf970596c"
        };

        const app = !getApps().length ? initializeApp(config) : getApps()[0];
        const db = getFirestore(app);

        // TESTE DE CONEXÃO E LEITURA
        const container = document.getElementById('maint-cards-container');
        
        try {
            const colRef = collection(db, "motos");
            onSnapshot(colRef, (snapshot) => {
                container.innerHTML = ""; // Limpa o "Carregando..."
                if (snapshot.empty) {
                    container.innerHTML = "<p>Nenhuma moto cadastrada no banco de dados.</p>";
                } else {
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        const div = document.createElement('div');
                        div.className = 'card';
                        div.innerHTML = `<strong>${data.modelo || 'Moto sem nome'}</strong>`;
                        container.appendChild(div);
                    });
                }
            }, (err) => {
                container.innerHTML = "Erro ao ler banco: " + err.message;
            });
        } catch (e) {
            container.innerHTML = "Erro no script: " + e.message;
        }
    </script>
</body>
</html>
